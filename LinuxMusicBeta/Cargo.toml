[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later"
repository = "https://github.com/EliezerSolinger/LinuxMusic"
publish = false

# Rules for every crate of the core (interfaces.md, Parte 2). The lm-sys-* crates opt out of `unsafe_code` and declare
# their safety sheet instead (I-17).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# Allowed lock-free crates (interfaces.md, I-17). Adding one needs a written decision there.
rtrb = "0.4"
triple_buffer = "8"
assert_no_alloc = { version = "1", default-features = false }   # the trap exists in release too (default `disable_release` removes it)
# Data
imbl = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ryu = "1"
blake3 = "1"
# System
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# lm-sys-alsa and lm-sys-linux (Linux only): the C types and calls of the system (poll, eventfd, sched, mlock, rlimit)
libc = "0.2"
# VST3 bindings generated from the SDK headers (MIT OR Apache-2.0), for the plugin host (I-9.6)
vst3 = "0.3"
# lm-sys-linux (Linux only): D-Bus for rtkit, logind and ReserveDevice1, pure Rust (decisoes-autonomas.md). zbus 6 has
# no `blocking` module any more: the crate drives it with `zbus::block_on` on its own thread, which is the blocking
# mode of the decision. `service` serves the ReserveDevice1 object; no proxies (the calls are written by hand).
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }
# DSP math (deterministic across distributions, V2)
libm = "0.2"
# Build scripts of the lm-sys-* crates that compile vendored C/C++ (reSID, Guitarix, Neural Amp Modeler): the
# compiler, its flags and the static archive (decisoes-autonomas.md, "Chips e amplificadores")
cc = { version = "1", features = ["parallel"] }
# Verification
loom = "0.7"
# The interface (lm-gui only; ci/check-core-no-gui.py keeps them out of the core). GPUI pinned exactly: gpui-pre is
# a weekly snapshot of Zed's main (this one: zed@d2a4fb6), the version gpui-component 0.10 requires; the official
# `gpui` crate on crates.io is a year old (docs/prototipo-interface.md, section 4)
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
gpui-component = "=0.10.0"
# The waveform tiles are RenderImages, built from image::Frame (the image crate GPUI uses)
image = { version = "0.25", default-features = false }

# Workspace crates
lm-base = { path = "crates/lm-base" }
lm-state = { path = "crates/lm-state" }
lm-time = { path = "crates/lm-time" }
lm-doc = { path = "crates/lm-doc" }
lm-render = { path = "crates/lm-render" }
lm-dsp = { path = "crates/lm-dsp" }
lm-plugin = { path = "crates/lm-plugin" }
lm-plugins-testsine = { path = "crates/lm-plugins-testsine" }
lm-plugins-tripleoscillator = { path = "crates/lm-plugins-tripleoscillator" }
lm-plugins-ampandir = { path = "crates/lm-plugins-ampandir" }
lm-plugins-sid = { path = "crates/lm-plugins-sid" }
lm-plugins-freeboy = { path = "crates/lm-plugins-freeboy" }
lm-plugins-opulenz = { path = "crates/lm-plugins-opulenz" }
lm-expr = { path = "crates/lm-expr" }
lm-plugins-effects = { path = "crates/lm-plugins-effects" }
lm-plugins-fluidsynth = { path = "crates/lm-plugins-fluidsynth" }
lm-plugins-instruments = { path = "crates/lm-plugins-instruments" }
lm-plugins-stk = { path = "crates/lm-plugins-stk" }
lm-sys-fpu = { path = "crates/lm-sys-fpu" }
lm-sys-samplerate = { path = "crates/lm-sys-samplerate" }
lm-sys-jack = { path = "crates/lm-sys-jack" }
lm-sys-sndfile = { path = "crates/lm-sys-sndfile" }
lm-sys-fluidsynth = { path = "crates/lm-sys-fluidsynth" }
lm-sys-alsa = { path = "crates/lm-sys-alsa" }
lm-sys-linux = { path = "crates/lm-sys-linux" }
lm-sys-coreaudio = { path = "crates/lm-sys-coreaudio" }
lm-sys-rubberband = { path = "crates/lm-sys-rubberband" }
lm-sys-lilv = { path = "crates/lm-sys-lilv" }
lm-sys-ipc = { path = "crates/lm-sys-ipc" }
lm-sys-clap = { path = "crates/lm-sys-clap" }
lm-sys-vst3 = { path = "crates/lm-sys-vst3" }
lm-sys-vst3-test = { path = "crates/lm-sys-vst3-test" }
lm-sys-nam = { path = "crates/lm-sys-nam" }
lm-sys-resid = { path = "crates/lm-sys-resid" }
lm-plugin-proxy = { path = "crates/lm-plugin-proxy" }
lm-plugin-host = { path = "crates/lm-plugin-host" }
lm-io = { path = "crates/lm-io" }
lm-compile = { path = "crates/lm-compile" }
lm-port = { path = "crates/lm-port" }
lm-port-fake = { path = "crates/lm-port-fake" }
lm-gui = { path = "crates/lm-gui", default-features = false }
lm-gui-plugins = { path = "crates/lm-gui-plugins" }
lm-session = { path = "crates/lm-session" }
lm-remote = { path = "crates/lm-remote" }
lm-midimap = { path = "crates/lm-midimap" }
lm-smf = { path = "crates/lm-smf" }
lm-sys-guitarix = { path = "crates/lm-sys-guitarix" }
lm-plugins-guitarix = { path = "crates/lm-plugins-guitarix" }

[profile.dev]
# Audio code is unusable without some optimisation. Disk is limited on the development machine: line tables are
# enough for backtraces, and incremental caches grow without bound with many agents building (decisoes-autonomas.md)
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.release]
debug = 1
panic = "unwind"   # needed to contain a plugin's panic (I-9.3)
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
