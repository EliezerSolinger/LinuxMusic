# cargo-deny for LinuxMusicBeta (run by the `deny` job of .github/workflows/beta.yml; locally:
# `cargo deny check` in this folder). It checks the licences, the banned and the allowed crates, the sources and the
# security advisories of every crate the workspace pulls in.
#
# The other rules of the CI that cargo-deny cannot express live in ci/:
#   - ci/check-core-no-gui.py: no core crate (lm-*, not lm-gui-*) has a GUI crate anywhere in its tree;
#   - ci/check-unsafe.py: `unsafe` only in lm-sys-* crates;
#   - ci/check-workspace-deps.py: every dependency comes from [workspace.dependencies], the one list of allowed
#     crates (interfaces.md, I-17).

[graph]
# The platforms the program is built for (interfaces.md, Parte 4: Linux x86-64 and aarch64, macOS aarch64).
# Dependencies only for other platforms (Windows...) are left out of every check. `cfg(loom)` dependencies are left
# out too: no target sets that cfg, and loom never goes into the program.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Optional dependencies count: a feature must not be a way around the rules
all-features = true

[output]
feature-depth = 1

[advisories]
# Every vulnerability and unsound advisory is an error (cargo-deny's fixed behaviour). A crate that is no longer
# maintained is an error when we depend on it directly, and a warning further down the tree.
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# An ignored advisory needs its reason and, when possible, an expiry date
ignore = []

[licenses]
# The sources are GPL-2.0-or-later. A dependency's licence must let the program be distributed under the GPL:
# permissive licences, the weak copylefts that allow it, and the GPL 2 or later itself.
#
# Apache-2.0 is allowed (decision of 19/11, docs/decisoes-autonomas.md): it is compatible with the GPL version 3 only,
# so a binary that contains an Apache-2.0-only crate (GPUI and gpui-component) is distributed under the GPLv3, which
# GPL-2.0-or-later allows; our own crates stay GPL-2.0-or-later.
#
# Not allowed: GPL-3.0-only, LGPL-3.0-*, AGPL-* and anything not listed. A crate that needs one is a decision for the
# user (written in docs/decisoes-autonomas.md) and then an entry in `exceptions` below, for that crate only.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-2.0-or-later",
]
confidence-threshold = 0.9
exceptions = []
# Unused entries in `allow` are expected (the list is the policy, not the current tree)
unused-allowed-license = "allow"

[licenses.private]
# The workspace crates are ours (GPL-2.0-or-later, publish = false)
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates refer to each other by path, without a version: that is not a wildcard on crates.io
allow-wildcard-paths = true
highlight = "all"

deny = [
    # ---- The GUI is GPUI, and only GPUI (decision of the user, 19/11) ----------------------------------------------
    # Qt and Slint are not used anywhere in the new program.
    { crate = "cxx-qt", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "cxx-qt-lib", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "cxx-qt-build", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "cxx-qt-gen", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "qmetaobject", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "qttypes", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "qt_core", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "qt_gui", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "qt_widgets", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "slint", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "slint-build", reason = "the GUI is GPUI only (decision of 19/11)" },
    { crate = "i-slint-core", reason = "the GUI is GPUI only (decision of 19/11)" },
    # GPUI is allowed only in the lm-gui crates, and the lock-free crates outside I-17 only outside the core: both
    # are about where in the tree a crate is, which cargo-deny cannot say, so ci/check-core-no-gui.py checks them
    # (lists in ci/gui-crates.txt and ci/core-banned-crates.txt). GPUI's own tree (lm-gui) uses some of them.
]

[sources]
# Only crates.io (GPUI comes from crates.io too). A git dependency needs an entry in allow-git or [sources.allow-org].
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
