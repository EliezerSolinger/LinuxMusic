[package]
name = "lm-sys-vst3-test"
description = "LinuxMusic: the VST3 test plugins of lm-sys-vst3 as a shared library, for the plugin host's tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints, copied, with `unsafe_code` allowed: an lm-sys-* crate is where unsafe lives (interfaces.md,
# Parte 2, rule 9, and I-17). Every unsafe block carries its SAFETY comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lm-sys-vst3 = { workspace = true, features = ["testing"] }
