[package]
name = "lm-sys-guitarix"
description = "LinuxMusic: Guitarix's units (its pedals, amps, cabinets: Faust and hand-written DSP, zita-resampler, zita-convolver), vendored and compiled in, with a safe binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# zita-resampler and zita-convolver are GPL-3.0-or-later (vendor/gx/COPYING, decisoes-autonomas.md "Do Guitarix")
license = "GPL-3.0-or-later"
publish.workspace = true
links = "lm_guitarix"
build = "build.rs"

# The workspace lints, copied (an lm-sys-* crate may not inherit `unsafe_code = "forbid"`, interfaces.md I-17),
# with the unsafe code held to written reasons instead
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
lm-base.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true

[[test]]
name = "no_alloc"
harness = false
