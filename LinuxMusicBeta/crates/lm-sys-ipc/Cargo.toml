[package]
name = "lm-sys-ipc"
description = "LinuxMusic: shared memory between processes and a wait/wake on its words (futex, __ulock), for the plugin host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints, copied, with `unsafe_code` allowed: an lm-sys-* crate is where unsafe lives (interfaces.md,
# Parte 2, rule 9, and I-17). Every unsafe block carries its SAFETY comment (clippy::undocumented_unsafe_blocks).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "allow"

[dependencies]
lm-base.workspace = true
libc.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true
