[package]
name = "lm-io"
description = "LinuxMusic: devices (Dummy, ALSA, CoreAudio), MIDI input, recording to disk, calibration and the resource store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The JACK backend and JACK MIDI (needs libjack at build time: libjack-jackd2-dev, or Homebrew's jack)
jack = ["dep:lm-sys-jack"]

[dependencies]
lm-base.workspace = true
lm-render.workspace = true
lm-sys-sndfile.workspace = true
lm-sys-samplerate.workspace = true
# The stretch of takes that follow the tempo (F-REC-090): R3, always (no other way to render them)
lm-sys-rubberband.workspace = true
# The platform-independent half (sample formats, MIDI translation, error keys) builds everywhere; the PCM, the
# sequencer and the system services exist only on Linux
lm-sys-alsa.workspace = true
lm-sys-linux.workspace = true
# macOS: the CoreAudio backend (empty crate elsewhere)
lm-sys-coreaudio.workspace = true
# The JACK backend (the `jack` feature: libjack must be installed; CI and the Mac have it, see ci/system-deps)
lm-sys-jack = { workspace = true, optional = true }
rtrb.workspace = true
assert_no_alloc.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
# statvfs (H3: free disk space), poll and eventfd (the raw MIDI reader)
rustix = { workspace = true, features = ["fs", "event"] }

[dev-dependencies]
lm-time.workspace = true
