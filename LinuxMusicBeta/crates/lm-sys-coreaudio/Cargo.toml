[package]
name = "lm-sys-coreaudio"
description = "LinuxMusic: the safe binding to CoreAudio (macOS): device enumeration, properties, IO procs and explicit private aggregates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints, copied, with `unsafe_code` allowed: an lm-sys-* crate is where unsafe lives (interfaces.md,
# Parte 2, rule 9, and I-17). Every unsafe block carries its SAFETY comment (clippy::undocumented_unsafe_blocks).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "allow"

# macOS only: on every other system the crate is empty
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
