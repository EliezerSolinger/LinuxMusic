# The DSP must give the same samples on every distribution (interfaces.md, V2): the float methods of the standard
# library call the system's libm, which changes between glibc versions. Use the pure `libm` crate, through
# `crate::math`, instead. (`sqrt`, `abs`, `min`, `max`, `clamp` and `copysign` are exact IEEE operations and allowed.)
disallowed-methods = [
    { path = "f32::sin", reason = "system libm: use crate::math (libm)" },
    { path = "f32::cos", reason = "system libm: use crate::math (libm)" },
    { path = "f32::tan", reason = "system libm: use crate::math (libm)" },
    { path = "f32::tanh", reason = "system libm: use crate::math (libm)" },
    { path = "f32::exp", reason = "system libm: use crate::math (libm)" },
    { path = "f32::exp2", reason = "system libm: use crate::math (libm)" },
    { path = "f32::ln", reason = "system libm: use crate::math (libm)" },
    { path = "f32::ln_1p", reason = "system libm: use crate::math (libm)" },
    { path = "f32::log10", reason = "system libm: use crate::math (libm)" },
    { path = "f32::log2", reason = "system libm: use crate::math (libm)" },
    { path = "f32::powf", reason = "system libm: use crate::math (libm)" },
    { path = "f32::powi", reason = "not specified to be exact: use crate::math (libm)" },
    { path = "f32::hypot", reason = "system libm: use crate::math (libm)" },
    { path = "f32::atan", reason = "system libm: use crate::math (libm)" },
    { path = "f32::atan2", reason = "system libm: use crate::math (libm)" },
    { path = "f32::sinh", reason = "system libm: use crate::math (libm)" },
    { path = "f32::cosh", reason = "system libm: use crate::math (libm)" },
    { path = "f32::mul_add", reason = "fused on some targets only: write the product and the sum" },
    { path = "f64::sin", reason = "system libm: use crate::math (libm)" },
    { path = "f64::cos", reason = "system libm: use crate::math (libm)" },
    { path = "f64::tan", reason = "system libm: use crate::math (libm)" },
    { path = "f64::tanh", reason = "system libm: use crate::math (libm)" },
    { path = "f64::exp", reason = "system libm: use crate::math (libm)" },
    { path = "f64::exp2", reason = "system libm: use crate::math (libm)" },
    { path = "f64::ln", reason = "system libm: use crate::math (libm)" },
    { path = "f64::ln_1p", reason = "system libm: use crate::math (libm)" },
    { path = "f64::log10", reason = "system libm: use crate::math (libm)" },
    { path = "f64::log2", reason = "system libm: use crate::math (libm)" },
    { path = "f64::powf", reason = "system libm: use crate::math (libm)" },
    { path = "f64::powi", reason = "not specified to be exact: use crate::math (libm)" },
    { path = "f64::hypot", reason = "system libm: use crate::math (libm)" },
    { path = "f64::atan", reason = "system libm: use crate::math (libm)" },
    { path = "f64::atan2", reason = "system libm: use crate::math (libm)" },
    { path = "f64::sinh", reason = "system libm: use crate::math (libm)" },
    { path = "f64::cosh", reason = "system libm: use crate::math (libm)" },
    { path = "f64::mul_add", reason = "fused on some targets only: write the product and the sum" },
]
