[package]
name = "lm-plugin"
description = "LinuxMusic: the plugin contract (descriptor, registry, build from the tree), the instrument functions every instrument gets, and the generated test suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The generated test suite (`testing`), for the plugin crates' tests
testing = ["dep:assert_no_alloc"]

[dependencies]
lm-base.workspace = true
lm-state.workspace = true
lm-doc.workspace = true
lm-render.workspace = true
lm-time.workspace = true
lm-dsp.workspace = true
libm.workspace = true
assert_no_alloc = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc.workspace = true
