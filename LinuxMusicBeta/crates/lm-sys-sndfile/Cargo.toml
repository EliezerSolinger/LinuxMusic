[package]
name = "lm-sys-sndfile"
description = "LinuxMusic: safe binding to libsndfile (read WAV/RF64/AIFF/FLAC/OGG/MP3, write WAV/RF64/FLAC/OGG with crash-safe header updates)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "sndfile"
build = "build.rs"

# The workspace lints, copied (an lm-sys-* crate may not inherit `unsafe_code = "forbid"`, interfaces.md I-17),
# with the unsafe code held to written reasons instead
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
lm-base.workspace = true

