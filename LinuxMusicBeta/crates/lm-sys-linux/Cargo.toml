[package]
name = "lm-sys-linux"
description = "LinuxMusic: Linux system services: real-time scheduling (rtkit), memory locking, the logind sleep inhibitor and ReserveDevice1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints, copied, with `unsafe_code` allowed: an lm-sys-* crate is where unsafe lives (interfaces.md,
# Parte 2, rule 9, and I-17). Every unsafe block carries its SAFETY comment (clippy::undocumented_unsafe_blocks).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "allow"

[dependencies]
lm-base.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The ReserveDevice1 test plays the part of PipeWire with its own connection
zbus.workspace = true
