[package]
name = "lm-gui"
description = "LinuxMusic: the graphical interface (GPUI), on the CorePort only (interfaces.md, I-15)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["runtime-shaders"]
# Compile GPUI's Metal shaders when the program starts: for a Mac with only the Command Line Tools (no `metal`
# compiler). A macOS release built with Xcode leaves it off
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
lm-port.workspace = true
lm-time.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
image.workspace = true

[dev-dependencies]
# Only the tests and the demo example: the interface never depends on the fake core
lm-port-fake.workspace = true
gpui = { workspace = true, features = ["test-support"] }
