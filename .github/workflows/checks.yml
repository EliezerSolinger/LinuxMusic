---
name: checks
'on':
  # The old program lives in legado/ (the new one, LinuxMusicBeta/, has its own workflow: beta.yml)
  push:
    paths:
      - 'legado/**'
      - '.gitmodules'
      - '.yamllint'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'legado/**'
      - '.gitmodules'
      - '.yamllint'
      - '.github/workflows/checks.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripted-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legado
    steps:
      - uses: actions/checkout@v2
      - name: Install python-tinycss2
        run: sudo apt-get install -y python3-tinycss2
      - name: Update submodules
        run: git submodule update --init --recursive
      - name: Verify scripted tests
        run: tests/scripted/verify
      - name: Run check-strings
        run: tests/scripted/check-strings
      - name: Run check-namespace
        run: tests/scripted/check-namespace
      - name: Run check-core-gui
        run: tests/scripted/check-core-gui
  shellcheck:
    runs-on: ubuntu-latest
    container: koalaman/shellcheck-alpine:v0.9.0
    defaults:
      run:
        working-directory: legado
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Run shellcheck
        run: |
          shellcheck \
            $(find "./cmake/" -type f -name '*.sh' -o -name "*.sh.in") \
            doc/bash-completion/linuxmusic \
            buildtools/update_locales
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Run yamllint
        run: for i in $(git ls-files '*.yml'); do yamllint $i; done
