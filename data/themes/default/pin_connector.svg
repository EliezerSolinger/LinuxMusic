<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Pin connector: a 1/4" (P10) TRS jack plug with its cable. LinuxMusic, CC0 -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="18" height="18" viewBox="0 0 18 18">
	<g transform="translate(9 9) rotate(-45) translate(-12 0)">
		<!-- the cable, curling away -->
		<path d="M 5.5 0 C 2.5 0 2.2 3.2 -0.6 3.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
		<!-- strain relief and handle -->
		<path d="M 5 -1.2 L 8 -2.4 L 8 2.4 L 5 1.2 Z" fill="#fff"/>
		<rect x="8" y="-2.6" width="7" height="5.2" rx="0.9" fill="#fff"/>
		<!-- collar -->
		<rect x="15.4" y="-1.8" width="1.2" height="3.6" fill="#fff"/>
		<!-- sleeve, ring and tip, apart from each other by their insulators -->
		<rect x="16.6" y="-1.1" width="4" height="2.2" fill="#fff"/>
		<rect x="21.2" y="-1.1" width="1.1" height="2.2" fill="#fff"/>
		<path d="M 22.9 -1.1 L 23.6 -1.1 C 24.6 -1.1 25 -0.5 25 0 C 25 0.5 24.6 1.1 23.6 1.1 L 22.9 1.1 Z" fill="#fff"/>
	</g>
</svg>
